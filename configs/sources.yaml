# Source specification (plan.md §7-9). Frozen after Phase-1 discovery + licensing.
# Exact commits are pinned into data/manifests/sources.lock.json at acquisition.
# Reference commits (repo_scout, 2026-07-10) are recorded in inventory/SELECTION.md.
#
# roles:
#   anchor              -> Azure training corpus (byte-level BPE trained on this)
#   transfer            -> other MicrosoftDocs repos (cross-repo transfer eval)
#   external_technical  -> non-Microsoft technical docs (transfer beyond MS style)
#   general_english     -> Wikipedia-derived English (training + regression eval)
# methods: git (sparse clone) | gh_api (deterministic blob download) | hf_parquet
# eval_category -> friendly plan.md §14 eval-set label (transfer sources only)

sources:
  # ----- Anchor: Azure documentation (CC-BY-4.0), 20 diverse services -----
  - name: azure-docs
    role: anchor
    repo: MicrosoftDocs/azure-docs
    license_id: CC-BY-4.0
    method: git
    paths:
      - articles/storage
      - articles/virtual-network
      - articles/application-gateway
      - articles/frontdoor
      - articles/expressroute
      - articles/app-service
      - articles/azure-functions
      - articles/container-apps
      - articles/batch
      - articles/hdinsight
      - articles/data-factory
      - articles/synapse-analytics
      - articles/service-bus-messaging
      - articles/event-hubs
      - articles/logic-apps
      - articles/api-management
      - articles/iot-hub
      - articles/automation
      - articles/backup
      - articles/site-recovery

  # ----- Transfer: MicrosoftDocs repos across strata (eval only) -----
  - name: architecture-center           # stratum: Azure-adjacent architecture
    role: transfer
    repo: MicrosoftDocs/architecture-center
    license_id: CC-BY-4.0
    method: gh_api
    paths: ["docs/"]
    eval_category: ms_architecture
    max_docs: 220

  - name: azure-devops-docs             # stratum: automation / DevOps
    role: transfer
    repo: MicrosoftDocs/azure-devops-docs
    license_id: CC-BY-4.0
    method: gh_api
    paths: ["docs/pipelines/"]
    eval_category: ms_devops
    max_docs: 220

  - name: sql-docs                      # stratum: data / database
    role: transfer
    repo: MicrosoftDocs/sql-docs
    license_id: CC-BY-4.0
    method: gh_api
    paths: ["docs/relational-databases/"]
    eval_category: ms_data
    max_docs: 220

  - name: fabric-docs                   # stratum: data / analytics (second)
    role: transfer
    repo: MicrosoftDocs/fabric-docs
    license_id: CC-BY-4.0
    method: gh_api
    paths: ["docs/data-engineering/"]
    eval_category: ms_data
    max_docs: 150

  - name: microsoft-365-docs            # stratum: broad enterprise / developer
    role: transfer
    repo: MicrosoftDocs/microsoft-365-docs
    license_id: CC-BY-4.0
    method: gh_api
    paths: ["microsoft-365/enterprise/"]
    eval_category: ms_broad_enterprise
    max_docs: 200

  # ----- External technical control: Kubernetes docs (CC-BY-4.0) -----
  - name: kubernetes-website
    role: external_technical
    repo: kubernetes/website
    license_id: CC-BY-4.0
    method: gh_api
    paths: ["content/en/docs/"]
    max_docs: 250

  # ----- General English control: Wikipedia-derived wikitext-103-raw -----
  - name: wikitext-103
    role: general_english
    hf_repo: Salesforce/wikitext
    license_id: CC-BY-SA-3.0
    method: hf_parquet
    hf_files:
      - wikitext-103-raw-v1/train-00000-of-00002.parquet
    max_docs: 20000
